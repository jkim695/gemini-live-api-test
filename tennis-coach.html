<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tennis Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --optic-yellow: #ccff00;
            --optic-yellow-dim: rgba(204, 255, 0, 0.15);
            --optic-yellow-glow: rgba(204, 255, 0, 0.4);
            --navy-deep: #0a0e14;
            --navy-mid: #131a24;
            --navy-light: #1c2635;
            --court-green: #2d5a27;
            --white: #ffffff;
            --white-dim: rgba(255, 255, 255, 0.7);
            --white-muted: rgba(255, 255, 255, 0.4);
            --danger: #ff4757;
            --purple-coach: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at top, var(--navy-mid) 0%, var(--navy-deep) 70%);
            min-height: 100vh;
            color: var(--white);
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ========== HEADER ========== */
        header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--optic-yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--optic-yellow), #9eff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-status {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-pill.active .dot {
            background: var(--optic-yellow);
            box-shadow: 0 0 12px var(--optic-yellow-glow);
            animation: glow-pulse 1.5s infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 8px var(--optic-yellow-glow); }
            50% { box-shadow: 0 0 20px var(--optic-yellow); }
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 0;
            overflow: hidden;
        }

        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        /* ========== VIDEO SECTION ========== */
        .video-section {
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #webcam, #poseCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #poseCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Scanning overlay effect */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .scan-overlay.active {
            opacity: 1;
        }

        .scan-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--optic-yellow), transparent);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .scan-overlay::after {
            content: '';
            position: absolute;
            inset: 20px;
            border: 2px solid var(--optic-yellow-dim);
            border-radius: 8px;
        }

        /* ========== METRICS OVERLAY (Picture-in-Picture) ========== */
        .metrics-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .metric-hud {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px 24px;
            border: 1px solid rgba(204, 255, 0, 0.2);
        }

        .metric-hud-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--white-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .metric-hud-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 3rem;
            font-weight: 700;
            color: var(--optic-yellow);
            text-shadow: 0 0 30px var(--optic-yellow-glow);
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .metric-hud-value .unit {
            font-size: 1.2rem;
            color: var(--white-dim);
        }

        .metric-hud-value .trend {
            font-size: 1.5rem;
            margin-left: 8px;
        }

        .metric-hud-value .trend.up { color: #22c55e; }
        .metric-hud-value .trend.down { color: var(--danger); }

        /* Center swing indicator */
        .swing-indicator-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .swing-indicator {
            background: var(--optic-yellow);
            color: var(--navy-deep);
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
            box-shadow: 0 0 40px var(--optic-yellow-glow);
        }

        .swing-indicator.active {
            opacity: 1;
            transform: scale(1);
            animation: swing-pulse 0.4s ease infinite;
        }

        @keyframes swing-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ========== START BUTTON OVERLAY ========== */
        .start-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 20, 0.9);
            z-index: 10;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .start-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--optic-yellow) 0%, #9eff00 100%);
            color: var(--navy-deep);
            font-size: 3.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 60px var(--optic-yellow-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px var(--optic-yellow);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .start-label {
            margin-top: 24px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--white-dim);
        }

        /* Stop button (small, corner) */
        .stop-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger);
            font-weight: 600;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
            display: none;
        }

        .stop-btn.visible {
            display: block;
        }

        .stop-btn:hover {
            background: rgba(255, 71, 87, 0.4);
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            background: var(--navy-light);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-section:last-child {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--white-muted);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--optic-yellow);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--white-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ========== TOAST NOTIFICATIONS (Hype Man) ========== */
        .toast-container {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column-reverse;
            gap: 12px;
            pointer-events: none;
        }

        .hype-toast {
            background: linear-gradient(135deg, var(--optic-yellow), #9eff00);
            color: var(--navy-deep);
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 40px var(--optic-yellow-glow);
            animation: toast-in 0.4s ease, toast-out 0.4s ease 2.5s forwards;
            white-space: nowrap;
        }

        .hype-toast.elite {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: 3px solid #fff;
            animation: toast-in 0.4s ease, elite-glow 0.5s ease infinite, toast-out 0.4s ease 3s forwards;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toast-out {
            to { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }

        @keyframes elite-glow {
            0%, 100% { box-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00; }
            50% { box-shadow: 0 0 40px #ffd700, 0 0 80px #ff8c00; }
        }

        /* ========== COACH ANALYSIS PANEL ========== */
        .coach-feed {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .coach-feed::-webkit-scrollbar {
            width: 4px;
        }

        .coach-feed::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .coach-analysis {
            background: rgba(168, 85, 247, 0.1);
            border-left: 4px solid var(--purple-coach);
            border-radius: 0 12px 12px 0;
            padding: 16px;
            margin-bottom: 12px;
            animation: slide-in 0.3s ease;
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .coach-analysis .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .coach-analysis .timestamp {
            font-size: 0.7rem;
            color: var(--white-muted);
        }

        .coach-analysis .swing-num {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--purple-coach);
            background: var(--purple-glow);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .coach-analysis .content {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--white-dim);
        }

        .coach-analysis .pro-tip {
            margin-top: 12px;
            padding: 12px;
            background: rgba(204, 255, 0, 0.1);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .coach-analysis .pro-tip strong {
            color: var(--optic-yellow);
        }

        .coach-analysis.loading .content::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--purple-coach);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--white-muted);
            font-size: 0.9rem;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ========== HISTORY REEL (Bottom) ========== */
        .history-reel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            display: flex;
            align-items: flex-end;
            padding: 12px 20px;
            gap: 12px;
            overflow-x: auto;
        }

        .history-reel::-webkit-scrollbar {
            display: none;
        }

        .history-thumb {
            flex-shrink: 0;
            width: 80px;
            height: 56px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .history-thumb:hover {
            border-color: var(--optic-yellow);
            transform: scale(1.1);
        }

        .history-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .history-thumb .swing-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--optic-yellow);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Hidden elements */
        #lowResCanvas {
            display: none;
        }
    </style>
</head>

            </div>
        </div>
    </div>

1. The telemetry data is GROUND TRUTH - if video is blurry, trust the data
2. Look for kinetic chain breakdowns:
   - Arming the ball (elbow leading instead of hip rotation)
   - Late contact point (ball behind optimal strike zone)
   - Insufficient knee bend (power loss from legs)
   - Poor shoulder rotation (less than 45° unit turn)
   - Wrist lag issues (early or late release)

3. Examine the computed metrics:
   - Peak racket head speed
   - Shoulder rotation angle
   - Contact point height relative to hips

OUTPUT FORMAT:
Provide exactly ONE specific, actionable correction. Be concise but technical.

Example: "Your shoulder rotation peaked at 38° - aim for 45°+ by initiating the unit turn earlier when you see the ball leave your opponent's racket."

Do NOT:
- Give generic advice
- List multiple corrections
- Praise without substance
- Repeat the telemetry data back`;

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        class DualStreamManager {
            constructor() {
                this.liveSocket = null;
                this.isLiveConnected = false;
                this.audioContext = null;
                this.audioProcessor = null;

                this.swingBuffer = [];
                this.telemetryBuffer = [];
                this.isRecordingSwing = false;
                this.swingStartTime = null;

                this.pose = null;
                this.isPoseReady = false;
                this.currentLandmarks = null;

                this.swingState = 'IDLE';
                this.swingCount = 0;

                this.mediaStream = null;
                this.frameInterval = null;

                this.lastWristPositions = [];
                this.peakRacketSpeed = 0;
                this.shoulderRotation = 0;
                this.contactHeight = 0;
                this.lastAnalysisTime = 0;

                // Session stats
                this.sessionPeakSpeed = 0;
                this.rotationHistory = [];
                this.lastSpeed = 0;
                this.lastRotation = 0;

                // Swing history for reel
                this.swingHistory = [];
            }

            async initialize() {
                await this.initializeMedia();
                await this.initializePose();
                await this.initializeLiveAPI();
            }

            async initializeMedia() {
                this.mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: CONFIG.HIGH_RES_WIDTH },
                        height: { ideal: CONFIG.HIGH_RES_HEIGHT },
                        frameRate: { ideal: 30 }
                    },
                    audio: {
                        sampleRate: CONFIG.AUDIO_INPUT_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                const webcam = document.getElementById('webcam');
                webcam.srcObject = this.mediaStream;
                await webcam.play();

                const poseCanvas = document.getElementById('poseCanvas');
                const lowResCanvas = document.getElementById('lowResCanvas');

                poseCanvas.width = webcam.videoWidth;
                poseCanvas.height = webcam.videoHeight;
                lowResCanvas.width = CONFIG.LOW_RES_WIDTH;
                lowResCanvas.height = CONFIG.LOW_RES_HEIGHT;

                this.audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: CONFIG.AUDIO_INPUT_RATE
                });
            }

            async initializePose() {
                this.pose = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
                });

                this.pose.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    enableSegmentation: false,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                this.pose.onResults((results) => this.onPoseResults(results));

                await this.pose.initialize();
                this.isPoseReady = true;
                updatePoseStatus(true);
            }

            async initializeLiveAPI() {
                updateConnectionStatus('connecting');
                showHypeToast('Connecting...', false);

                const wsUrl = `${CONFIG.LIVE_API_URL}?key=${CONFIG.GEMINI_API_KEY}`;
                this.liveSocket = new WebSocket(wsUrl);

                this.liveSocket.onopen = () => {
                    console.log('Live API connected');
                    this.sendLiveSetup();
                };

                this.liveSocket.onmessage = async (event) => {
                    let data = event.data;
                    if (data instanceof Blob) {
                        data = await data.text();
                    }
                    this.handleLiveMessage(data);
                };

                this.liveSocket.onerror = (error) => {
                    console.error('Live API error:', error);
                    updateConnectionStatus('disconnected');
                };

                this.liveSocket.onclose = (event) => {
                    console.log('Live API closed:', event.code, event.reason);
                    this.isLiveConnected = false;
                    updateConnectionStatus('disconnected');
                };
            }

            sendLiveSetup() {
                const setup = {
                    setup: {
                        model: CONFIG.HYPE_MODEL,
                        generation_config: {
                            response_modalities: ['AUDIO']
                        },
                        system_instruction: {
                            parts: [{ text: HYPE_MAN_INSTRUCTION }]
                        }
                    }
                };
                this.liveSocket.send(JSON.stringify(setup));
            }

            handleLiveMessage(data) {
                try {
                    const message = JSON.parse(data);
                    console.log('Live message:', message);

                    if (message.setupComplete) {
                        this.isLiveConnected = true;
                        updateConnectionStatus('connected');
                        document.getElementById('scanOverlay').classList.add('active');
                        showHypeToast("LET'S GO!", false);
                        this.startStreaming();
                    }

                    if (message.serverContent) {
                        const parts = message.serverContent.modelTurn?.parts || [];
                        for (const part of parts) {
                            if (part.text) {
                                showHypeToast(part.text, false);
                            }
                            if (part.inlineData?.mimeType?.startsWith('audio/')) {
                                this.playAudio(part.inlineData.data);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Failed to parse live message:', error);
                }
            }

            startStreaming() {
                this.startAudioCapture();

                this.frameInterval = setInterval(() => {
                    this.processFrame();
                }, 33);

                setInterval(() => {
                    this.sendLowResFrame();
                }, CONFIG.FRAME_INTERVAL_MS);
            }

            startAudioCapture() {
                const source = this.audioContext.createMediaStreamSource(this.mediaStream);
                const processor = this.audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!this.isLiveConnected || !this.liveSocket) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(inputData.length);

                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }

                    const uint8Array = new Uint8Array(pcmData.buffer);
                    let binary = '';
                    for (let i = 0; i < uint8Array.length; i++) {
                        binary += String.fromCharCode(uint8Array[i]);
                    }

                    const message = {
                        realtimeInput: {
                            mediaChunks: [{
                                mimeType: 'audio/pcm;rate=16000',
                                data: btoa(binary)
                            }]
                        }
                    };
                    this.liveSocket.send(JSON.stringify(message));
                };

                source.connect(processor);
                processor.connect(this.audioContext.destination);
                this.audioProcessor = processor;
            }

            async processFrame() {
                if (!this.isPoseReady) return;
                const webcam = document.getElementById('webcam');
                await this.pose.send({ image: webcam });
            }

            sendLowResFrame() {
                if (!this.isLiveConnected || !this.liveSocket) return;

                const webcam = document.getElementById('webcam');
                const lowResCanvas = document.getElementById('lowResCanvas');
                const ctx = lowResCanvas.getContext('2d');

                ctx.drawImage(webcam, 0, 0, CONFIG.LOW_RES_WIDTH, CONFIG.LOW_RES_HEIGHT);
                const dataUrl = lowResCanvas.toDataURL('image/jpeg', 0.6);
                const base64 = dataUrl.split(',')[1];

                const message = {
                    realtimeInput: {
                        mediaChunks: [{
                            mimeType: 'image/jpeg',
                            data: base64
                        }]
                    }
                };
                this.liveSocket.send(JSON.stringify(message));
            }

            onPoseResults(results) {
                this.drawPose(results);

                if (!results.poseLandmarks) return;

                this.currentLandmarks = results.poseLandmarks;
                this.updateSwingStateMachine(results.poseLandmarks);
                this.computeMetrics(results.poseLandmarks);

                if (this.isRecordingSwing) {
                    this.bufferTelemetry(results.poseLandmarks);
                }
            }

            drawPose(results) {
                const canvas = document.getElementById('poseCanvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (results.poseLandmarks) {
                    // Draw with optic yellow
                    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
                        color: '#ccff00',
                        lineWidth: 3
                    });
                    drawLandmarks(ctx, results.poseLandmarks, {
                        color: '#9eff00',
                        lineWidth: 1,
                        radius: 4
                    });
                }
            }

            updateSwingStateMachine(landmarks) {
                const rightWrist = landmarks[16];
                const rightShoulder = landmarks[12];
                const leftShoulder = landmarks[11];

                const shoulderAngle = Math.atan2(
                    rightShoulder.y - leftShoulder.y,
                    rightShoulder.x - leftShoulder.x
                ) * (180 / Math.PI);

                this.lastWristPositions.push({ x: rightWrist.x, y: rightWrist.y, t: Date.now() });
                if (this.lastWristPositions.length > 10) {
                    this.lastWristPositions.shift();
                }

                const wristVelocity = this.calculateWristVelocity();

                switch (this.swingState) {
                    case 'IDLE':
                        if (Math.abs(shoulderAngle) > 30 && rightWrist.x > rightShoulder.x) {
                            this.swingState = 'UNIT_TURN';
                            this.startSwingRecording();
                        }
                        break;

                    case 'UNIT_TURN':
                        if (wristVelocity > 0.02 && rightWrist.x < rightShoulder.x) {
                            this.swingState = 'FORWARD_SWING';
                        }
                        break;

                    case 'FORWARD_SWING':
                        const bodyCenter = (leftShoulder.x + rightShoulder.x) / 2;
                        if (rightWrist.x < bodyCenter - 0.1) {
                            this.swingState = 'FOLLOW_THROUGH';
                            this.peakRacketSpeed = wristVelocity * 100;
                        }
                        break;

                    case 'FOLLOW_THROUGH':
                        if (wristVelocity < 0.01) {
                            this.completeSwing();
                            this.swingState = 'IDLE';
                        }
                        break;
                }

                const indicator = document.getElementById('swingIndicator');
                indicator.classList.toggle('active', this.swingState !== 'IDLE');
            }

            calculateWristVelocity() {
                if (this.lastWristPositions.length < 2) return 0;

                const recent = this.lastWristPositions.slice(-2);
                const dx = recent[1].x - recent[0].x;
                const dy = recent[1].y - recent[0].y;
                const dt = (recent[1].t - recent[0].t) / 1000;

                return Math.sqrt(dx * dx + dy * dy) / dt;
            }

            computeMetrics(landmarks) {
                const rightShoulder = landmarks[12];
                const leftShoulder = landmarks[11];
                this.shoulderRotation = Math.abs(Math.atan2(
                    rightShoulder.y - leftShoulder.y,
                    rightShoulder.x - leftShoulder.x
                ) * (180 / Math.PI));

                const rightWrist = landmarks[16];
                const rightHip = landmarks[24];
                const heightDiff = (rightHip.y - rightWrist.y) * 100;
                this.contactHeight = heightDiff > 0 ? 'High' : 'Low';

                // Update HUD
                const rotationEl = document.getElementById('shoulderRotation');
                rotationEl.textContent = this.shoulderRotation.toFixed(0);

                // Update trends
                const rotationTrend = document.getElementById('rotationTrend');
                if (this.lastRotation > 0) {
                    if (this.shoulderRotation > this.lastRotation + 2) {
                        rotationTrend.textContent = '▲';
                        rotationTrend.className = 'trend up';
                    } else if (this.shoulderRotation < this.lastRotation - 2) {
                        rotationTrend.textContent = '▼';
                        rotationTrend.className = 'trend down';
                    } else {
                        rotationTrend.textContent = '';
                    }
                }
                this.lastRotation = this.shoulderRotation;

                document.getElementById('contactHeight').textContent = this.contactHeight;

                if (this.peakRacketSpeed > 0) {
                    const speedEl = document.getElementById('racketSpeed');
                    speedEl.textContent = this.peakRacketSpeed.toFixed(0);

                    const speedTrend = document.getElementById('speedTrend');
                    if (this.lastSpeed > 0) {
                        if (this.peakRacketSpeed > this.lastSpeed + 2) {
                            speedTrend.textContent = '▲';
                            speedTrend.className = 'trend up';
                        } else if (this.peakRacketSpeed < this.lastSpeed - 2) {
                            speedTrend.textContent = '▼';
                            speedTrend.className = 'trend down';
                        } else {
                            speedTrend.textContent = '';
                        }
                    }
                    this.lastSpeed = this.peakRacketSpeed;
                }
            }

            startSwingRecording() {
                this.isRecordingSwing = true;
                this.swingStartTime = Date.now();
                this.swingBuffer = [];
                this.telemetryBuffer = [];
                console.log('Started swing recording');
            }

            bufferTelemetry(landmarks) {
                const frame = {
                    timestamp: Date.now() - this.swingStartTime,
                    joints: {
                        right_wrist: this.extractJoint(landmarks[16]),
                        right_elbow: this.extractJoint(landmarks[14]),
                        right_shoulder: this.extractJoint(landmarks[12]),
                        left_shoulder: this.extractJoint(landmarks[11]),
                        right_hip: this.extractJoint(landmarks[24]),
                        left_hip: this.extractJoint(landmarks[23]),
                        right_knee: this.extractJoint(landmarks[26]),
                        left_knee: this.extractJoint(landmarks[25])
                    }
                };
                this.telemetryBuffer.push(frame);

                const webcam = document.getElementById('webcam');
                const canvas = document.createElement('canvas');
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                canvas.getContext('2d').drawImage(webcam, 0, 0);
                this.swingBuffer.push(canvas.toDataURL('image/jpeg', 0.9));
            }

            extractJoint(landmark) {
                return {
                    x: landmark.x,
                    y: landmark.y,
                    z: landmark.z || 0,
                    visibility: landmark.visibility || 1
                };
            }

            async completeSwing() {
                this.isRecordingSwing = false;
                this.swingCount++;
                document.getElementById('swingCount').textContent = this.swingCount;

                // Update session stats
                if (this.peakRacketSpeed > this.sessionPeakSpeed) {
                    this.sessionPeakSpeed = this.peakRacketSpeed;
                    document.getElementById('peakSpeed').textContent = this.sessionPeakSpeed.toFixed(0);
                }

                this.rotationHistory.push(this.shoulderRotation);
                const avgRot = this.rotationHistory.reduce((a, b) => a + b, 0) / this.rotationHistory.length;
                document.getElementById('avgRotation').textContent = avgRot.toFixed(0) + '°';

                // Play ding if speed goal reached
                if (this.peakRacketSpeed >= CONFIG.SPEED_GOAL_MPH) {
                    playDing();
                    showHypeToast('ELITE POWER!', true);
                }

                // Add to history reel
                this.addToHistoryReel();

                console.log(`Swing ${this.swingCount} completed. Frames: ${this.swingBuffer.length}`);
                await this.analyzeSwing();
            }

            addToHistoryReel() {
                if (this.swingBuffer.length === 0) return;

                const reel = document.getElementById('historyReel');
                const thumb = document.createElement('div');
                thumb.className = 'history-thumb';
                thumb.innerHTML = `
                    <img src="${this.swingBuffer[Math.floor(this.swingBuffer.length / 2)]}" alt="Swing ${this.swingCount}">
                    <span class="swing-badge">#${this.swingCount}</span>
                `;
                thumb.onclick = () => this.showSwingAnalysis(this.swingCount);
                reel.appendChild(thumb);
                reel.scrollLeft = reel.scrollWidth;

                this.swingHistory.push({
                    num: this.swingCount,
                    thumbnail: this.swingBuffer[Math.floor(this.swingBuffer.length / 2)],
                    speed: this.peakRacketSpeed,
                    rotation: this.shoulderRotation
                });
            }

            showSwingAnalysis(swingNum) {
                const analysis = document.querySelector(`.coach-analysis[data-swing="${swingNum}"]`);
                if (analysis) {
                    analysis.scrollIntoView({ behavior: 'smooth' });
                    analysis.style.boxShadow = '0 0 20px var(--purple-glow)';
                    setTimeout(() => analysis.style.boxShadow = '', 1000);
                }
            }

            async analyzeSwing() {
                if (this.swingBuffer.length === 0) return;

                const now = Date.now();
                if (this.lastAnalysisTime && (now - this.lastAnalysisTime) < 10000) {
                    console.log('Rate limited - skipping analysis');
                    addCoachAnalysis('Swing recorded. Cooldown...', false, now, this.swingCount);
                    return;
                }
                this.lastAnalysisTime = now;

                const analysisId = Date.now();
                addCoachAnalysis('Analyzing swing...', true, analysisId, this.swingCount);

                try {
                    const telemetrySummary = {
                        frame_count: this.telemetryBuffer.length,
                        duration_ms: this.telemetryBuffer.length > 0 ?
                            this.telemetryBuffer[this.telemetryBuffer.length - 1].timestamp : 0,
                        peak_racket_speed_estimate: this.peakRacketSpeed.toFixed(1) + ' mph',
                        max_shoulder_rotation: this.shoulderRotation.toFixed(1) + '°',
                        contact_height: this.contactHeight,
                        key_frames: this.telemetryBuffer.filter((_, i) =>
                            i % Math.ceil(this.telemetryBuffer.length / 5) === 0
                        )
                    };

                    const keyFrameIndices = [
                        0,
                        Math.floor(this.swingBuffer.length * 0.3),
                        Math.floor(this.swingBuffer.length * 0.6),
                        this.swingBuffer.length - 1
                    ];

                    const keyFrames = keyFrameIndices.map(i => ({
                        inlineData: {
                            mimeType: 'image/jpeg',
                            data: this.swingBuffer[Math.min(i, this.swingBuffer.length - 1)].split(',')[1]
                        }
                    }));

                    console.log('Sending to Gemini:', keyFrames.length, 'frames');

                    const response = await fetch(`${CONFIG.GEMINI_REST_URL}?key=${CONFIG.GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: DEEP_COACH_INSTRUCTION },
                                    { text: `\n\nTELEMETRY DATA:\n${JSON.stringify(telemetrySummary, null, 2)}\n\nAnalyze the following swing frames:` },
                                    ...keyFrames
                                ]
                            }],
                            generationConfig: {
                                temperature: 0.3,
                                maxOutputTokens: 1024
                            }
                        })
                    });

                    const result = await response.json();
                    console.log('Gemini response:', JSON.stringify(result, null, 2));

                    if (result.error) {
                        throw new Error(result.error.message || JSON.stringify(result.error));
                    }

                    const analysisText = result.candidates?.[0]?.content?.parts?.[0]?.text
                        || 'No analysis returned. Check console for details.';

                    updateCoachAnalysis(analysisId, analysisText);

                } catch (error) {
                    console.error('Coach analysis failed:', error);
                    updateCoachAnalysis(analysisId, 'Analysis failed: ' + error.message);
                }
            }

            playAudio(base64Data) {
                try {
                    const binaryString = atob(base64Data);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    const samples = new Int16Array(bytes.buffer);
                    const floatSamples = new Float32Array(samples.length);
                    for (let i = 0; i < samples.length; i++) {
                        floatSamples[i] = samples[i] / 32768.0;
                    }

                    const audioBuffer = this.audioContext.createBuffer(
                        1, floatSamples.length, CONFIG.AUDIO_OUTPUT_RATE
                    );
                    audioBuffer.getChannelData(0).set(floatSamples);

                    const source = this.audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.audioContext.destination);
                    source.start();
                } catch (error) {
                    console.error('Audio playback error:', error);
                }
            }

            destroy() {
                if (this.frameInterval) clearInterval(this.frameInterval);
                if (this.audioProcessor) this.audioProcessor.disconnect();
                if (this.liveSocket) this.liveSocket.close();
                if (this.mediaStream) this.mediaStream.getTracks().forEach(track => track.stop());
                if (this.audioContext) this.audioContext.close();
            }
        }

        // ============================================
        // UI HELPERS
        // ============================================
        let manager = null;

        function updateConnectionStatus(status) {
            const el = document.getElementById('connectionStatus');
            el.classList.toggle('active', status === 'connected');
            el.querySelector('.text').textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        function updatePoseStatus(active) {
            const el = document.getElementById('poseStatus');
            el.classList.toggle('active', active);
            el.querySelector('.text').textContent = active ? 'Pose Active' : 'Pose Off';
        }

        function showHypeToast(text, isElite = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'hype-toast' + (isElite ? ' elite' : '');
            toast.textContent = text;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3500);
        }

        function playDing() {
            const audio = document.getElementById('dingSfx');
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function addCoachAnalysis(text, loading = false, id = null, swingNum = 0) {
            const feed = document.getElementById('coachFeed');
            const emptyState = feed.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const analysis = document.createElement('div');
            analysis.className = 'coach-analysis' + (loading ? ' loading' : '');
            if (id) analysis.dataset.id = id;
            if (swingNum) analysis.dataset.swing = swingNum;

            analysis.innerHTML = `
                <div class="header">
                    <span class="timestamp">${new Date().toLocaleTimeString()}</span>
                    <span class="swing-num">Swing #${swingNum}</span>
                </div>
                <div class="content">${text}</div>
            `;
            feed.insertBefore(analysis, feed.firstChild);

            while (feed.children.length > 10) {
                feed.removeChild(feed.lastChild);
            }
        }

        function updateCoachAnalysis(id, text) {
            const analysis = document.querySelector(`.coach-analysis[data-id="${id}"]`);
            if (analysis) {
                analysis.classList.remove('loading');
                const contentEl = analysis.querySelector('.content');
                contentEl.innerHTML = `
                    ${text}
                    <div class="pro-tip">
                        <strong>Pro Tip:</strong> Focus on this correction for your next 5 swings.
                    </div>
                `;
            }
        }

        async function startSession() {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('stopBtn').classList.add('visible');

            try {
                manager = new DualStreamManager();
                await manager.initialize();
            } catch (error) {
                console.error('Failed to start:', error);
                alert('Failed to start: ' + error.message);
                stopSession();
            }
        }

        function stopSession() {
            if (manager) {
                manager.destroy();
                manager = null;
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('startOverlay').classList.remove('hidden');
            document.getElementById('stopBtn').classList.remove('visible');
            document.getElementById('scanOverlay').classList.remove('active');
            updateConnectionStatus('disconnected');
            updatePoseStatus(false);
            document.getElementById('webcam').srcObject = null;
        }

        window.addEventListener('beforeunload', stopSession);
    </script>
